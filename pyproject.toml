[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aliasing-atlas"
dynamic = ["version"]
description = "An interactive pedagogical tool for visualizing signal sampling and aliasing."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Wissem Boussetta"}
]
keywords = ["signal-processing", "dsp", "sampling", "aliasing", "nyquist", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
    "sounddevice>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "mypy>=1.8",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Boussetta/NyquistNavigator"
Repository = "https://github.com/Boussetta/NyquistNavigator"
Issues = "https://github.com/Boussetta/NyquistNavigator/issues"

[project.scripts]
aliasing-atlas = "aliasing_atlas.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "aliasing_atlas.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests", "src/aliasing_atlas"]